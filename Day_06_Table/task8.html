<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Order Bill</title>
</head>

<body>
<h1>Restaurant Order Bill</h1>

<table border="1" cellpadding="10" cellspacing="0">

    <thead>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
    </thead>

    <tbody>

        <!-- Food Items -->
        <tr>
            <td>Paneer Tikka</td>
            <td>2</td>
            <td>₹180</td>
            <td>₹360</td>
        </tr>

        <tr>
            <td>Veg Biryani</td>
            <td>1</td>
            <td>₹220</td>
            <td>₹220</td>
        </tr>

        <tr>
            <td>Dal Tadka</td>
            <td>1</td>
            <td>₹180</td>
            <td>₹180</td>
        </tr>

        <tr>
            <td>Cold Coffee</td>
            <td>2</td>
            <td>₹130</td>
            <td>₹260</td>
        </tr>

        <!-- Bill Summary -->
        <tr>
            <th colspan="3">Subtotal</th>
            <td>₹1,020</td>
        </tr>

        <tr>
            <th colspan="3">GST (18%)</th>
            <td>₹183.60</td>
        </tr>

        <tr>
            <th colspan="3">Discount</th>
            <td>₹100</td>
        </tr>

        <tr>
            <th colspan="3">Grand Total</th>
            <th>₹1,103.60</th>
        </tr>

    </tbody>
</table>
</body>
</html>
