<!DOCTYPE html>
<html>
<head>
    <title>Complaint Registration Form</title>
</head>

<body>

    <h1>Customer Complaint Form</h1>

    <form>

        <!-- Customer Name -->
        <label>Customer Name:</label>
        <input type="text" name="customerName" placeholder="Enter customer name" required>
        <br><br>

        <!-- Customer ID -->
        <label>Customer ID:</label>
        <input type="text"  name="customerId"  placeholder="Enter customer ID"  required>
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email"  name="email"  placeholder="Enter your email"  required>
        <br><br>

        <!-- Mobile -->
        <label>Mobile:</label>
        <input type="tel"  name="mobile"  placeholder="Enter your mobile number"  required>
        <br><br>

        <!-- Complaint Category -->
        <label>Complaint Category:</label>
        <select name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Product">Product</option>
            <option value="Service">Service</option>
            <option value="Delivery">Delivery</option>
            <option value="Payment">Payment</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <!-- Priority -->
        <label>Priority:</label>
        <br>

        <input type="radio" name="priority" value="Low" required>
        Low

        <input type="radio" name="priority" value="Medium">
        Medium

        <input type="radio" name="priority" value="High">
        High

        <br><br>

        <!-- Complaint Description -->
        <label>Complaint Description:</label>
        <br>

        <textarea name="description" rows="6" cols="40" placeholder="Describe your complaint" required></textarea>
        <br><br>

        <!-- Preferred Contact Method -->
        <label>Preferred Contact Method:</label>
        <br>

        <input type="radio"  name="contactMethod"  value="Email"  required>
        Email

        <input type="radio"  name="contactMethod"  value="Phone">
        Phone

        <input type="radio"  name="contactMethod"  value="SMS">
        SMS

        <br><br>

        <!-- Submit Complaint Button -->
        <input type="submit" value="Submit Complaint">

    </form>

</body>
</html>
