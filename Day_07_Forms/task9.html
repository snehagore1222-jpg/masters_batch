<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Opening Form</title>
</head>

<body>

    <h1>Bank Account Opening Form</h1>

    <form>

        <!-- Applicant Name -->
        <label>Applicant Name:</label>
        <input type="text" name="applicantname" placeholder="Enter your full name" required>
        <br><br>

        <!-- Date of Birth -->
        <label>Date of Birth:</label>
        <input type="date" name="dob" required>
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <br>
        <input type="radio" name="gender" value="Male" required>
        <label>Male</label>

        <input type="radio" name="gender" value="Female">
        <label>Female</label>

        <input type="radio" name="gender" value="Other">
        <label>Other</label>
        <br><br>

        <!-- Account Type -->
        <label>Account Type:</label>
        <br>
        <input type="radio" name="accounttype" value="Savings" required>
        <label>Savings</label>

        <input type="radio" name="accounttype" value="Current">
        <label>Current</label>
        <br><br>

        <!-- Mobile Number -->
        <label>Mobile Number:</label>
        <input type="tel" name="mobile" placeholder="Enter your mobile number" required>
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <!-- Address -->
        <label>Address:</label>
        <br>
         <textarea name="address" rows="5" cols="40" placeholder="Enter your complete address" required></textarea>
        <br><br>

        <!-- City -->
        <label>City:</label>
        <input type="text" name="city" placeholder="Enter your city" required>
        <br><br>

        <!-- State -->
        <label>State:</label>
        <select name="state" required>
            <option value="">-- Select State --</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Telangana">Telangana</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
        </select>
        <br><br>

        <!-- Occupation -->
        <label>Occupation:</label>
        <input type="text" name="occupation" placeholder="Enter your occupation" required>
        <br><br>

        <!-- PAN Number -->
        <label>PAN Number:</label>
        <input type="text" name="pan" placeholder="Enter your PAN number" required>
        <br><br>

        <!-- Terms and Conditions -->
        <input type="checkbox" name="terms" value="accepted" required>
        <label>I agree to the Terms & Conditions</label>
        <br><br>

        <!-- Submit -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
