<!DOCTYPE html>
<html>
    <head>
        <title>Customer Feedback Form</title>
    </head>

    <body>

        <h1>Customer Feedback Form</h1>

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter Your Name" Required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter Your Email" Required>
        <br><br>

        <label>Overall Experience:</label>
        <br>
         <input type="radio" name="Experience" value="Excellent">
         <label>Excellent</label>

         <input type="radio" name="Experience" value="Good">
         <label>Good</label>

         <input type="radio" name="Experience" value="Average">
         <label>Average</label>

         <input type="radio" name="Experience" value="Poor">
         <label>Poor</label>
         <br><br>

         <label>Services Used:</label>
         <br>
         <input type="checkbox" name="services" value="website">
         <label>Website</label>

         <input type="checkbox" name="services" value="Customer Support"> 
         <label>Customer Support</label> 
         
         <input type="checkbox" name="services" value="Online Service"> 
         <label>Online Service</label> 
         
         <input type="checkbox" name="services" value="Delivery"> 
         <label>Delivery</label>
         <br><br>

         <label>Comments:</label>
         <br>
         <textarea name="Comments" rows="6" cols="30" placeholder="Enter Your Comments"></textarea>
         <br><br>

         <input type="submit" value="Submit">
         <input type="reset" value="Reset">


    </body>
</html>
