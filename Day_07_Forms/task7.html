<!DOCTYPE html>
<html>
    <head>
        <title>Emplyoee Regestration</title>
    </head>

    <body>
        <h1>Emplyoee Regestration</h1>

        <form>

            <label>Emplyoee ID:</label>
            <input type="text" name="emplyoeeid" placeholder="Enter Emplyoee ID" required>
            <br><br>

            <label>Emplyoee Name:</label>
            <input type="text" name="emplyoeename" placeholder="Enter Emplyoee Name" required>
            <br><br>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter Your Email" required>
            <br><br>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter Your Password" required>
            <br><br>

            <label>Department:</label>
            
            <select name="Department" required>
                <option value="">--Select Department--</option>
                <option value="IT">IT</option>
                <option value="finance">Finance</option>
                <option value="marketing">Marketing</option>
                <option  value="Sales">Sales</option>
            </select>
             <br><br>
             
            <label>Designation:</label> 
            <select name="designation" required> 
                <option value="">-- Select Designation --</option> 
                <option value="Software Developer">Software Developer</option> 
                <option value="Software Tester">Software Tester</option> 
                <option value="Team Leader">Team Leader</option> 
                <option value="Project Manager">Project Manager</option> 
                <option value="HR Executive">HR Executive</option> 
            </select> 
            <br><br> 
            
            <label>Gender:</label> 
            <br> 
            <input type="radio" name="gender" value="Male" required> 
            <label>Male</label> 
            
            <input type="radio" name="gender" value="Female"> 
            <label>Female</label> 
            
            <input type="radio" name="gender" value="Other"> 
            <label>Other</label> 
            <br><br> 
            
            <label>Skills:</label> 
            <br> 
            <input type="checkbox" name="skills" value="Java"> 
            <label>Java</label> 

            <input type="checkbox" name="skills" value="HTML"> 
            <label>HTML</label> 

            <input type="checkbox" name="skills" value="CSS"> 
            <label>CSS</label> 

            <input type="checkbox" name="skills" value="JavaScript"> 
            <label>JavaScript</label> 
            
            <input type="checkbox" name="skills" value="SQL"> 
            <label>SQL</label> 
            <br><br>  
            
            <label>Experience (Years):</label> 
            <input type="number" name="experience" min="0" max="40" placeholder="Enter years of experience" required> 
            <br><br>  
            
            <label>Address:</label> 
            <br> 
            <textarea name="address" rows="5" cols="40" placeholder="Enter employee address" required></textarea> 
            <br><br>
            
            <input type="submit" value="Submit">

        </form>
    </body>
</html>
