<!DOCTYPE html>
<html>
<head>
    <title>Product Review Form</title>
</head>

<body>

    <h1>Product Review Form</h1>

    <form>

        <!-- Customer Name -->
        <label>Customer Name:</label>
        <input type="text" name="customerName" placeholder="Enter your name" required>
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email"  name="email"  placeholder="Enter your email"  required>
        <br><br>

        <!-- Product Name -->
        <label>Product Name:</label>
        <input type="text" name="productName" placeholder="Enter product name" required>
        <br><br>

        <!-- Rating -->
        <label>Rating:</label>
        <br>
        <input type="radio" name="rating" value="1" required>
        1 Star
        <br>

        <input type="radio" name="rating" value="2">
        2 Stars
        <br>

        <input type="radio" name="rating" value="3">
        3 Stars
        <br>

        <input type="radio" name="rating" value="4">
        4 Stars
        <br>

        <input type="radio" name="rating" value="5">
        5 Stars
        <br><br>

        <!-- Review -->
        <label>Review:</label>
        <br>

        <textarea name="review" rows="5" cols="40" placeholder="Write your review" required></textarea>
        <br><br>

        <!-- Recommend Product -->
        <label>Recommend Product?</label>
        <br>
        <input type="radio" name="recommend" value="Yes" required>
        Yes

        <input type="radio" name="recommend" value="No">
        No
        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit Review">

    </form>

</body>
</html>
