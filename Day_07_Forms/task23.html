<!DOCTYPE html>
<html>
<head>
    <title>IT Support Ticket Form</title>
</head>

<body>

    <h1>IT Support Ticket Form</h1>

    <form>

        <!-- Employee Name -->
        <label>Employee Name:</label>
        <input type="text" name="employeeName" placeholder="Enter employee name" required>
        <br><br>

        <!-- Employee ID -->
        <label>Employee ID:</label>
        <input type="text" name="employeeId" placeholder="Enter employee ID" required>
        <br><br>

        <!-- Department -->
        <label>Department:</label>
        <select name="department" required>
            <option value="">-- Select Department --</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
        </select>

        <br><br>

        <!-- Issue Category -->
        <label>Issue Category:</label>
        <select name="issueCategory" required>
            <option value="">-- Select Issue Category --</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Network">Network</option>
            <option value="Email">Email</option>
            <option value="Login">Login</option>
            <option value="Printer">Printer</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <!-- Priority -->
        <label>Priority:</label>
        <input type="radio" name="priority" value="Low" required>
        Low

        <input type="radio" name="priority" value="Medium">
        Medium

        <input type="radio" name="priority" value="High">
        High
        <br><br>

        <!-- Device Type -->
        <label>Device Type:</label>
        <select name="deviceType" required>
            <option value="">-- Select Device --</option>
            <option value="Laptop">Laptop</option>
            <option value="Desktop">Desktop</option>
            <option value="Mobile">Mobile</option>
            <option value="Tablet">Tablet</option>
            <option value="Printer">Printer</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <!-- Issue Description -->
        <label>Issue Description:</label>
        <br>
        <textarea name="issueDescription" rows="5" cols="40" placeholder="Describe your issue" required></textarea>
        <br><br>

        <!-- Contact Number -->
        <label>Contact Number:</label>
        <input type="tel"  name="contactNumber"  placeholder="Enter contact number"  required>
        <br><br>

       
        <input type="submit" value="Submit Ticket">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
