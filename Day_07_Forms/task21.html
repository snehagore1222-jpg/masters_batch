<!DOCTYPE html>
<html>
<head>
    <title>Employee Leave Application</title>
</head>

<body>

    <h1>Employee Leave Application</h1>

    <form>

        <!-- Employee ID -->
        <label>Employee ID:</label>
        <input type="text" name="employeeId" placeholder="Enter employee ID" required>
        <br><br>

        <!-- Employee Name -->
        <label>Employee Name:</label>
        <input type="text" name="employeeName" placeholder="Enter employee name" required>
        <br><br>

        <!-- Department -->
        <label>Department:</label>
        <select name="department" required>
            <option value="">-- Select Department --</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
        </select>

        <br><br>

        <!-- Leave Type -->
        <label>Leave Type:</label>
        <br>

        <input type="radio" name="leaveType" value="Casual" required>
        Casual

        <input type="radio" name="leaveType" value="Sick">
        Sick

        <input type="radio" name="leaveType"  value="Paid">
        Paid

        <br><br>

        <!-- From Date -->
        <label>From Date:</label>
        <input type="date" name="fromDate" required>
        <br><br>

        <!-- To Date -->
        <label>To Date:</label>
        <input type="date" name="toDate" required>
        <br><br>

        <!-- Reason -->
        <label>Reason:</label>
        <br>

        <textarea name="reason" rows="5" cols="40" placeholder="Enter reason for leave" required></textarea>
        <br><br>

        <!-- Manager Name -->
        <label>Manager Name:</label>
        <input type="text"  name="managerName" placeholder="Enter manager name" required>
        <br><br>

        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
