<!DOCTYPE html>
<html>
<head>
    <title>Checkout Form</title>
</head>

<body>

    <h1>Shopping Checkout</h1>

    <form>

        <!-- Customer Name -->
        <label>Customer Name:</label>
        <input type="text" name="customerName" placeholder="Enter your name" required>
        <br><br>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <!-- Mobile -->
        <label>Mobile:</label>
        <input type="tel" name="mobile" placeholder="Enter your mobile number" required>
        <br><br>

        <!-- Address -->
        <label>Address:</label>
        <br>
        <textarea name="address" rows="4" cols="40" placeholder="Enter your complete address" required></textarea>
        <br><br>

        <!-- City -->
        <label>City:</label>
        <input type="text" name="city" placeholder="Enter your city" required>
        <br><br>

        <!-- State -->
        <label>State:</label>
        <select name="state" required>
            <option value="">-- Select State --</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Telangana">Telangana</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
        </select>

        <br><br>

        <!-- Pincode -->
        <label>Pincode:</label>
        <input type="number"  name="pincode"  min="100000"  max="999999" placeholder="Enter 6 digit pincode" required>
        <br><br>

        <!-- Payment Method -->
        <label>Payment Method:</label>
        <br>

        <input type="radio"  name="payment"  value="Credit Card"  required>
        Credit Card
        <br>
        
        <input type="radio" name="payment" value="Debit Card">
        Debit Card
        <br>

        <input type="radio" name="payment" value="UPI">
        UPI
        <br>
        
       <input type="radio" name="payment" value="Cash on Delivery">
        Cash on Delivery
        <br><br>

        <!-- Place Order Button -->
        <input type="submit" value="Place Order">

    </form>

</body>
</html>
