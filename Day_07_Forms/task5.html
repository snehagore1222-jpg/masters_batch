<!DOCTYPE html>
<html>
    <head>
        <title>Course Enrollement</title>
    </head>

    <body>
        <h1>Course Enrollement</h1>

        <form>

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter Yuor Name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter Yuor Email" required>
        <br><br>

        <label>Mobile No:</label>
        <input type="tel" name="mobile no" placeholder="Enter Yuor Mobile No." required>
        <br><br>

        <label>Select Course:</label>
        <select name="course" required>
            <option value=""> --Select Course--</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="Web Development">Web Devlopment</option>
            <option value="Data Science">Data Science</option>
        </select>
        <br><br>

        <label>Learning Mode:</label>
        <br>

        <input type="radio" name="learning Mode" value="Online" required>
        <label>Online</label>
        
        <input type="radio" name="learning Mode" value="Offline" required>
        <label>Offline</label>

        <input type="radio" name="learning Mode" value="Hybrid" required>
        <label>Hybrid</label>
        <br><br>

        <label>Skills:</label>
        <br>
        <input type="checkbox" name="Skills" value="HTML">
        <label>HTML</label>

        <input type="checkbox" name="Skills" value="CSS">
        <label>CSS</label>

        <input type="checkbox" name="Skills" value="Java">
        <label>Java</label>

        <input type="checkbox" name="Skills" value="JavaScript">
        <label>JavaScript</label>
        <br><br>

        <label>Address:</label>
        <br>
        <textarea name="Address" rows="6" cols="50" placeholder="Enter Your Address" required></textarea>
        <br><br>

        <input type="submit" value="Submit">

        </form>

    </body>
</html>
