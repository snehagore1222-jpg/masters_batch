<!DOCTYPE html>
<html>
<head>
    <title>Shipping Address Form</title>
</head>

<body>

    <h1>Shipping Address</h1>

    <form>

        <!-- Full Name -->
        <label>Full Name:</label>
        <input type="text" name="fullName" placeholder="Enter your full name" required>
        <br><br>

        <!-- Mobile Number -->
        <label>Mobile Number:</label>
        <input type="tel"  name="mobile"  placeholder="Enter your mobile number"  required>
        <br><br>

        <!-- House/Building -->
        <label>House/Building:</label>
        <input type="text"  name="house"  placeholder="Enter house/building number"  required>
        <br><br>

        <!-- Street -->
        <label>Street:</label>
        <input type="text" name="street" placeholder="Enter street name" required>
        <br><br>

        <!-- City -->
        <label>City:</label>
        <input type="text"  name="city"  placeholder="Enter your city"  required>
        <br><br>

        <!-- State -->
        <label>State:</label>
        <select name="state" required>
            <option value="">-- Select State --</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Telangana">Telangana</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
        </select>

        <br><br>

        <!-- Pincode -->
        <label>Pincode:</label>
        <input type="number" name="pincode" min="100000" max="999999" placeholder="Enter 6 digit pincode" required>
        <br><br>

        <!-- Address Type -->
        <label>Address Type:</label>
        <br>
        <input type="radio" name="addressType" value="Home" required>
        Home
        <br>

        <input type="radio" name="addressType" value="Office">
        Office
        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Save Address">

    </form>

</body>
</html>
