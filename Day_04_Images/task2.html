<!DOCTYPE html>
<html>
    <head>
        <title> Media Challenge </title>
    </head>

    <body>
        <h1>My Media Webpage</h1>

        <h2>Image</h2>

        <img src="../Images/christmas.jpg" alt="christmas" width="300" height="250"> 

        <h2> Audio Files </h2>

         <h3>Audio 1</h3>
        <audio controls>
            <source src="../Audio/christmas.mp3" >
            Your browser does not support the audio tag.
        </audio>

        <h3>Audio 2</h3>
        <audio controls>
            <source src="../Audio/Summer Breeze.mp3" >
        </audio>

        <h2> Video </h2>
        <h3>Video 1</h3>
        <video width="400" height="350"controls>
            <source src="../Video/ChristmasTree.mp4" >
        </video>

        <h3>Video 2</h3>
        <video width="400" height="350"controls>
            <source src="../Video/Work-meeting-ready.mp4" >
        </video>

        <h2>Youtube Video's</h2>
        <h3>YouTube Video1</h3>
        <iframe
              width="500"
              height="450"
              src="https://www.youtube.com/embed/SiTJhJMlP_I"
              title="song 1"
              allowfullscreen>
        </iframe>

        <h3>YouTube Video2</h3>
        <iframe
              width="500"
              height="450"
              src="https://www.youtube.com/embed/ebZj_nrmH-c"
              title="song 2"
              allowfullscreen >
        </iframe>

        
    <h2>Website using Iframe</h2>

    <iframe
        src="https://www.wikipedia.org/"
        width="600"
        height="400">
    </iframe>

    </body>
</html>
